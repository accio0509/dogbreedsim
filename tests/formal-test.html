<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>V0.4.0 正式接入验收</title><style>body{font:16px/1.65 system-ui,sans-serif;margin:24px;max-width:900px}.pass{color:#267744}.fail{color:#b34840}button{padding:10px}details{margin:10px 0}</style><h1>V0.4.0 正式接入验收</h1><p>使用真实引擎、内存模拟存档。不会读取或清空正式游戏存档。</p><button id="run">运行全部犬种测试</button><p id="summary" role="status"></p><div id="results"></div><script type="module">
import {getAllBreeds} from '../data/species/dog/breeds.js';import {runFormalChecks} from './formal-checks.js';import {runReleaseChecks} from './release-checks.js';import {runLifecycleChecks} from './lifecycle-checks.js';
document.getElementById('run').onclick=()=>{const root=document.getElementById('results');root.replaceChildren();let pass=0,fail=0;for(const b of getAllBreeds()){const group=document.createElement('details'),title=document.createElement('summary');group.append(title);let p=0,f=0;for(const [fn,n] of [[runFormalChecks,16],[runReleaseChecks,24],[runLifecycleChecks,26]]){let r;try{r=fn(b.id);}catch(e){r=[{name:'初始化异常',success:false,message:e.message}];}if(r.length!==n)r.push({name:'测试数量不符',success:false,message:`预期 ${n} 项`});for(const x of r){const row=document.createElement('div');row.className=x.success?'pass':'fail';row.textContent=(x.success?'✓ ':'✗ ')+x.name+(x.message?'：'+x.message:'');group.append(row);x.success?p++:f++;}}title.textContent=`${b.name}：${p} 通过，${f} 失败`;if(f)group.open=true;root.append(group);pass+=p;fail+=f;}document.getElementById('summary').textContent=`${pass} 项通过，${fail} 项失败`;};
</script></html>
