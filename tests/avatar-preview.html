<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVG 犬种头像预览</title><style>body{font:16px system-ui,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;background:#faf9f6;color:#342e29}label{display:inline-flex;gap:5px;align-items:center;margin:5px}select{padding:6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:20px}article{background:white;border:1px solid #ddd;border-radius:10px;text-align:center;padding:12px}svg{width:100%;max-width:145px;display:block;margin:auto}small{color:#666}</style><h1>24 犬种 · SVG 头像预览 V1.4</h1><p>独立素材调试页，不读取或修改游戏存档。可自由选择基因颜色；不代表各犬种实际可获得组合。</p><div id="controls"></div><main id="gallery"></main><script type="module">
import {getAllBreeds} from '../data/species/dog/breeds.js';
import {APPEARANCE_GENES,APPEARANCE_LOCI} from '../data/species/dog/appearance.js';
import {renderPortrait} from '../ui/avatar/renderer.js';
const defaults={coatColor:'C07',pattern:'P3',patternColor:'M04',eyeColor:'E01',hairLength:'L3'};
const controls=document.querySelector('#controls'), gallery=document.querySelector('#gallery');
for(const [l,genes] of Object.entries(APPEARANCE_GENES)){const label=document.createElement('label');label.textContent=APPEARANCE_LOCI[l];const select=document.createElement('select');select.name=l;for(const [id,g] of Object.entries(genes)){const o=new Option(g.name,id);select.add(o);}select.value=defaults[l];label.append(select);controls.append(label);select.onchange=draw;}
function draw(){const p={};for(const select of controls.querySelectorAll('select'))p[select.name]={...APPEARANCE_GENES[select.name][select.value],allele:select.value};p.patternVisible=p.pattern.allele!=='P0'&&p.coatColor.hex!==p.patternColor.hex;gallery.replaceChildren();for(const b of getAllBreeds()){const card=document.createElement('article');card.innerHTML=renderPortrait(b.id,p);const label=document.createElement('div');label.textContent=b.name;card.append(label);gallery.append(card);}}draw();
</script></html>
