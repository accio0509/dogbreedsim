<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>开发者工具验收</title><style>body{font:16px/1.7 system-ui,sans-serif;margin:24px;max-width:900px}.pass{color:#267744}.fail{color:#b34840}</style><h1>开发者工具验收</h1><p>使用真实引擎与内存存档，不读取浏览器正式存档。</p><button id="run">运行测试</button><h2 id="summary" role="status"></h2><div id="results"></div><script type="module">import {runDevChecks} from './dev-checks.js';import {getAllBreeds} from '../data/species/dog/breeds.js';document.getElementById('run').onclick=()=>{const root=document.getElementById('results');root.replaceChildren();let pass=0,fail=0;for(const b of getAllBreeds()){const h=document.createElement('h3');h.textContent=b.name;root.append(h);for(const r of runDevChecks(b.id)){const row=document.createElement('div');row.className=r.success?'pass':'fail';row.textContent=(r.success?'✓ ':'✗ ')+r.name+(r.message?'：'+r.message:'');root.append(row);r.success?pass++:fail++;}}document.getElementById('summary').textContent=`${pass} 项通过，${fail} 项失败`;};</script></html>
